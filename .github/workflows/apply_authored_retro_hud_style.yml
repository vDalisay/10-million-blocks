name: Apply authored retro HUD style

on:
  push:
    branches:
      - codex/future-world-progression
    paths:
      - tools/apply_authored_retro_hud_style.py
      - .github/workflows/apply_authored_retro_hud_style.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/future-world-progression
          fetch-depth: 0

      - name: Apply authored styling pass
        run: python3 tools/apply_authored_retro_hud_style.py

      - name: Validate content
        run: |
          python3 tools/validate_content.py
          python3 tools/validate_progression_contracts.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TenMillionBlocks.csproj

      - name: Build styled tree
        run: dotnet build TenMillionBlocks.csproj --configuration Release --no-restore

      - name: Commit styling pass
        run: |
          rm tools/apply_authored_retro_hud_style.py
          rm .github/workflows/apply_authored_retro_hud_style.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Style gameplay HUD as authored retro mining console"
          git push origin HEAD:codex/future-world-progression
