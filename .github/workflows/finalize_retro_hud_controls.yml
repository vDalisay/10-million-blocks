name: Finalize retro HUD controls

on:
  push:
    branches:
      - codex/future-world-progression
    paths:
      - tools/finalize_retro_hud_controls.py
      - .github/workflows/finalize_retro_hud_controls.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/future-world-progression
          fetch-depth: 0

      - name: Apply final control styling
        run: python3 tools/finalize_retro_hud_controls.py

      - name: Validate content
        run: |
          python3 tools/validate_content.py
          python3 tools/validate_progression_contracts.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TenMillionBlocks.csproj

      - name: Build final styled tree
        run: dotnet build TenMillionBlocks.csproj --configuration Release --no-restore

      - name: Commit final styling and clean helper
        run: |
          rm tools/finalize_retro_hud_controls.py
          rm .github/workflows/finalize_retro_hud_controls.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish retro console styling across gameplay controls"
          git push origin HEAD:codex/future-world-progression
