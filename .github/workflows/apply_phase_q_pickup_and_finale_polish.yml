name: Apply Phase Q pickup and finale polish

on:
  push:
    branches:
      - codex/future-world-progression
    paths:
      - tools/apply_phase_q_pickup_and_finale_polish.py
      - .github/workflows/apply_phase_q_pickup_and_finale_polish.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/future-world-progression
          fetch-depth: 0

      - name: Apply Phase Q polish
        run: python3 tools/apply_phase_q_pickup_and_finale_polish.py

      - name: Validate content
        run: |
          python3 tools/validate_content.py
          python3 tools/validate_progression_contracts.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TenMillionBlocks.csproj

      - name: Build patched tree
        run: dotnet build TenMillionBlocks.csproj --configuration Release --no-restore

      - name: Commit implementation
        run: |
          rm tools/apply_phase_q_pickup_and_finale_polish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Strengthen pickup CRT and polish demo finale"
          git push origin HEAD:codex/future-world-progression
