name: Apply retro futuristic HUD

on:
  push:
    branches:
      - codex/future-world-progression
    paths:
      - tools/apply_retro_futuristic_hud.py
      - .github/workflows/apply_retro_futuristic_hud.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/future-world-progression
          fetch-depth: 0

      - name: Apply retro HUD overhaul
        run: python3 tools/apply_retro_futuristic_hud.py

      - name: Validate content
        run: |
          python3 tools/validate_content.py
          python3 tools/validate_progression_contracts.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TenMillionBlocks.csproj

      - name: Build patched tree
        run: dotnet build TenMillionBlocks.csproj --configuration Release --no-restore

      - name: Commit implementation
        run: |
          rm tools/apply_retro_futuristic_hud.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Overhaul gameplay HUD with retro futuristic rails"
          git push origin HEAD:codex/future-world-progression

# retry after helper-anchor fix
