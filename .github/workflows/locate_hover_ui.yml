name: Locate hover mining UI

on:
  push:
    branches:
      - codex/future-world-progression
    paths:
      - .github/workflows/locate_hover_ui.yml

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/future-world-progression
      - name: Find hover mining UI definitions
        run: |
          echo '=== exact phrase ==='
          grep -R -n -i --include='*.cs' 'hover mining' src || true
          echo '=== hover-related UI code ==='
          grep -R -n -i --include='*.cs' -E 'hover.*(button|toggle|text|label)|((button|toggle|text|label).*)hover' src || true
