name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/one-million-squared-plan
      - codex/future-world-progression
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply passive skill expansion
        if: github.event_name == 'push'
        run: |
          python3 tools/apply_passive_skill_expansion.py
          if git diff --quiet; then
            echo "Passive skill expansion already committed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/skills/skill_tree.json data/worlds/worlds.json tools/validate_content.py tools/validate_progression_contracts.py src/UI/SkillTreeIncrementalTheme.cs
            git commit -m "Expand passive incremental skill branches"
            git push origin HEAD:codex/future-world-progression
          fi

      - name: Validate content
        run: |
          python3 tools/validate_content.py
          python3 tools/validate_progression_contracts.py
          python3 -m py_compile tools/analyze_pacing_reports.py

      - name: Skill economy balance simulation
        run: python3 tools/simulate_skill_economy.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TenMillionBlocks.csproj

      - name: Build
        run: dotnet build TenMillionBlocks.csproj --configuration Release --no-restore

      - name: Validate deterministic generation
        run: dotnet run --project tools/generation_contract/GenerationContract.csproj --configuration Release

      - name: Validate replay codec
        run: dotnet run --project tools/replay_contract/ReplayContract.csproj --configuration Release
