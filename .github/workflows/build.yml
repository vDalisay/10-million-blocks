name: Build

# Kept manual while this repository's hosted Actions runner access is unreliable.
# Re-enable push/pull_request once hosted runners consistently start jobs.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TenMillionBlocks.csproj

      - name: Build
        run: dotnet build TenMillionBlocks.csproj --configuration Release --no-restore
