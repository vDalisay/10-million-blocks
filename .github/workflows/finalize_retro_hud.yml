name: Finalize retro futuristic HUD

on:
  push:
    branches:
      - codex/future-world-progression
    paths:
      - tools/finalize_retro_hud.py
      - .github/workflows/finalize_retro_hud.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/future-world-progression
          fetch-depth: 0

      - name: Apply final HUD integration
        run: python3 tools/finalize_retro_hud.py

      - name: Validate content
        run: |
          python3 tools/validate_content.py
          python3 tools/validate_progression_contracts.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TenMillionBlocks.csproj

      - name: Build patched tree
        run: dotnet build TenMillionBlocks.csproj --configuration Release --no-restore

      - name: Commit final integration and clean helpers
        run: |
          rm -f tools/finalize_retro_hud.py
          rm -f .github/workflows/apply_retro_futuristic_hud.yml
          rm -f .github/workflows/patch_retro_hud_helper.yml
          rm -f .github/workflows/patch_retro_hud_helper_v2.yml
          rm -f .github/workflows/finalize_retro_hud.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize retro futuristic gameplay HUD"
          git push origin HEAD:codex/future-world-progression
